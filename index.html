<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Container-Planer 3D</title>
<meta name="theme-color" content="#161d24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#11161b;color:#e8edf2;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#161d24;border-bottom:1px solid #26313b;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;margin-right:auto;display:flex;align-items:center;gap:6px}
.brand i{display:inline-block;width:18px;height:12px;border-radius:2px;background:repeating-linear-gradient(90deg,#3b8bb5 0 3px,#2f6f8f 3px 6px)}
.views{display:flex;background:#0e1318;border-radius:10px;padding:3px;gap:2px}
.views button{border:0;background:none;color:#9fb0bf;padding:7px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.views button.on{background:#2f7fb0;color:#fff}
#main{flex:1;display:flex;min-height:0}
#viewport{flex:1;position:relative;min-height:0;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:10px;bottom:10px;right:10px;pointer-events:none;color:#fff;font-size:12px;text-shadow:0 1px 3px #000a;opacity:.9}
#dims{position:absolute;left:10px;top:10px;background:#0e1318cc;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none}
#panel{background:#161d24;border-top:1px solid #26313b;display:flex;flex-direction:column;height:44vh;min-height:0}
#panel.collapsed{height:auto}
#panel.collapsed #content{display:none}
#tabs{display:flex;overflow-x:auto;gap:2px;padding:6px 6px 0;border-bottom:1px solid #26313b;flex-shrink:0}
#tabs button{flex:1;min-width:max-content;border:0;background:none;color:#9fb0bf;padding:9px 10px;font:inherit;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
#tabs button.on{color:#fff;border-bottom-color:#2f9be0}
#content{overflow-y:auto;padding:12px;flex:1;-webkit-overflow-scrolling:touch}
@media (min-width:900px){
  #main{flex-direction:row}
  #panel{width:380px;height:auto;border-top:0;border-left:1px solid #26313b}
  #panel.collapsed{height:auto}
}
@media (max-width:899px){#main{flex-direction:column}}
label{display:block;font-size:12px;color:#9fb0bf;margin:0 0 4px}
.grp{margin-bottom:12px}
.row2,.row3,.row4{display:grid;gap:8px;margin-bottom:12px}
.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:repeat(3,1fr)}.row4{grid-template-columns:repeat(4,1fr)}
input[type=number],select,textarea{width:100%;background:#0e1318;border:1px solid #2a3642;color:#e8edf2;border-radius:8px;padding:8px;font:inherit;font-size:16px}
textarea{font-size:12px;min-height:80px;font-family:ui-monospace,monospace}
input[type=color]{width:44px;height:36px;border:1px solid #2a3642;border-radius:8px;background:#0e1318;padding:2px;cursor:pointer}
input[type=range]{width:100%;accent-color:#2f9be0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#e8edf2;margin-top:22px}
.chk input{width:20px;height:20px;accent-color:#2f9be0}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swb{width:32px;height:32px;border-radius:8px;border:2px solid #ffffff22;cursor:pointer}
.btn,.btnrow button,.grid button,.card button,#sel button{background:#22303c;border:1px solid #2f3e4b;color:#e8edf2;border-radius:9px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:#2f7fb0;border-color:#2f7fb0}
.btn.warn,.card .del{background:#3a2226;border-color:#5a2e35;color:#ffb4b4}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:14px}
.grid button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:9px 10px}
.grid small{color:#8a9aa8;font-weight:400;font-size:11px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
h4{margin:6px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#7f93a5}
.card{background:#1b242d;border:1px solid #26313b;border-radius:12px;padding:10px;margin-bottom:10px}
.cardh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card button{padding:6px 10px;font-size:13px}
.info,.tip{color:#a9b8c5;font-size:13px;margin:6px 0 12px}
.tip{background:#1b242d;border-left:3px solid #2f9be0;padding:8px 10px;border-radius:6px}
.file{display:block;text-align:center;background:#2f7fb0;color:#fff;padding:12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:12px}
.file input{display:none}
#sel{display:none;padding:10px 12px;background:#1d2a35;border-bottom:1px solid #2f3e4b;flex-shrink:0}
#sel.on{display:block}
#sel .selh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sel .selh b{margin-right:auto}
#sel .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#sel button{padding:7px 10px;font-size:13px}
#sel .row3{margin:8px 0 0}
#sel input[type=number]{padding:6px;font-size:15px}
.listline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #222d37;font-size:13px}
#modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:#161d24;border-radius:14px;padding:12px;max-width:100%;max-height:100%;overflow:auto;text-align:center}
#modal img{max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto 10px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb0bf}
.err{color:#ffb4b4}
</style>

<body>
<div id="app">
  <header id="top">
    <div class="brand"><i></i>Container-Planer 3D</div>
    <div class="views">
      <button data-view="aussen" class="on">Außen</button>
      <button data-view="schnitt">Innen</button>

    </div>
  </header>
  <div id="main">
    <main id="viewport"><div id="loading">3D wird geladen …</div><div id="dims"></div><div id="hint"></div></main>
    <section id="panel">
      <div id="sel"></div>
      <nav id="tabs">
        <button data-tab="container" class="on">Container</button>
        <button data-tab="oeffnungen">Fenster &amp; Türen</button>

      <div id="content"></div>
    </section>
  </div>
</div>
<div id="modal" hidden><div class="box" id="modalbox"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { idbGet, idbSet, idbDel } from './idb.js';

/* ---------- Grunddaten ---------- */
const PRESETS = {
  '10':   {name:"10' Mini",        L:2.991,  W:2.438, H:2.591},
  '20':   {name:"20' Standard",    L:6.058,  W:2.438, H:2.591},
  '20hc': {name:"20' High Cube",   L:6.058,  W:2.438, H:2.896},
  '40':   {name:"40' Standard",    L:12.192, W:2.438, H:2.591},
  '40hc': {name:"40' High Cube",   L:12.192, W:2.438, H:2.896},
};
const FLOOR_TOP = 0.16, SKIN = 0.04, LINING = 0.025;
const EXT_SW = ['#2f6f8f','#8e2f25','#3d5c3a','#5f6670','#33373b','#e9e7e1','#c8b48a','#d98a2b'];
const OPTYPES = {
  fenster:  {n:'Fenster',      w:1.2, h:1.0,  sill:0.9},
  panorama: {n:'Panoramafenster', w:2.4, h:2.0, sill:0.1},
  tuer:     {n:'Tür',          w:0.9, h:2.0,  sill:0},
  glastuer: {n:'Glastür',      w:1.0, h:2.05, sill:0},
  oeffnung: {n:'Durchbruch',   w:1.2, h:2.0,  sill:0},
};
const WALLS = {links:'Links (lang)', rechts:'Rechts (lang)', hinten:'Hinten (Stirnseite)', vorne:'Vorne (Türseite)'};
const uid = () => Math.random().toString(36).slice(2,9);

function defaultState(){
  return {preset:'20', ...PRESETS['20'], ext:'#2f6f8f', int:'#f2efe8', intTex:'holz', floor:'eiche', ins:0.05,
    frame:'#2e3236', doorsLook:true, photoOut:true, photoIn:true,
    openings:[
      {id:uid(), wall:'rechts', type:'panorama', u:-0.9, w:2.4, h:2.0, sill:0.1},
      {id:uid(), wall:'rechts', type:'tuer', u:1.7, w:0.9, h:2.0, sill:0},
      {id:uid(), wall:'links', type:'fenster', u:-1.2, w:1.2, h:1.0, sill:0.9},
    ],
    items:[
      {id:uid(), k:'sofa', x:-1.6, z:-0.65, rot:0, w:2.0, d:0.9, h:0.85, col:'#6b7a8f'},
      {id:uid(), k:'deck', x:0, z:2.6, rot:0, w:4.0, d:2.4, h:0.16, col:'#9b7653'},
    ]};
}
let S = defaultState();
try { const raw = localStorage.getItem('container-planer-v1'); if (raw) S = {...defaultState(), ...JSON.parse(raw)}; } catch(e){}
let saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem('container-planer-v1', JSON.stringify(S)); }catch(e){} }, 300); }

const fmt = (n,d=2) => Number(n).toFixed(d).replace('.',',');
const lt = (c,a) => '#'+new THREE.Color(c).offsetHSL(0,0,a).getHexString();
function rnd(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function inner(){ const t = SKIN+S.ins+LINING; return {Li:S.L-2*t, Wi:S.W-2*t, Hi:(S.H-0.06-S.ins)-FLOOR_TOP}; }

/* ---------- Szene ---------- */
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.prepend(renderer.domElement);
document.getElementById('loading').remove();
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cbdbe6');
scene.fog = new THREE.Fog('#cbdbe6', 40, 120);
const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 300);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.1; controls.maxPolarAngle = Math.PI*0.495;

scene.add(new THREE.HemisphereLight(0xe6f2ff, 0x55664a, 1.1));
const sun = new THREE.DirectionalLight(0xfff6e8, 2.4);
sun.position.set(9,15,7); sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({color:'#7f9d68', roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const pad = new THREE.Mesh(new THREE.BoxGeometry(1,0.02,1), new THREE.MeshStandardMaterial({color:'#b3ada1', roughness:1}));
pad.position.y = 0.01; pad.receiveShadow = true; scene.add(pad);

let containerGroup = new THREE.Group(); scene.add(containerGroup);
const itemsGroup = new THREE.Group(); scene.add(itemsGroup);
const scanRoot = new THREE.Group(); const scanTilt = new THREE.Group(); scanRoot.add(scanTilt); scene.add(scanRoot);
let wallGroups = [], roofParts = [];

/* ---------- Texturen ---------- */
function canvasTex(w,h,draw,ru,rv){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(ru,rv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
const corrugTex = () => canvasTex(128,4,(x,w,h)=>{ const g=x.createLinearGradient(0,0,w,0);
  [[0,232],[0.3,232],[0.38,170],[0.5,205],[0.8,205],[0.88,255],[1,232]].forEach(([p,v])=>g.addColorStop(p,`rgb(${v},${v},${v})`)); x.fillStyle=g; x.fillRect(0,0,w,h); }, 1/0.278, 1);
const boardsTex = (base, bw, horizontal, seed) => canvasTex(512,512,(x,w,h)=>{ const r=rnd(seed); const px=bw*512; const c0=new THREE.Color(base);
  const n=Math.ceil(512/px);
  for(let i=0;i<n;i++){ let pos=0; while(pos<512){ const len=horizontal? 120+r()*260 : 512; const c=c0.clone().offsetHSL((r()-.5)*0.02,(r()-.5)*0.08,(r()-.5)*0.08);
      x.fillStyle='#'+c.getHexString(); if(horizontal) x.fillRect(pos,i*px,len,px); else x.fillRect(i*px,0,px,512);
      x.strokeStyle='rgba(0,0,0,.08)'; for(let k=0;k<6;k++){ x.beginPath(); if(horizontal){ const yy=i*px+r()*px; x.moveTo(pos,yy); x.lineTo(pos+len,yy+(r()-.5)*4);} else { const xx=i*px+r()*px; x.moveTo(xx,0); x.lineTo(xx+(r()-.5)*4,512);} x.stroke(); }
      x.fillStyle='rgba(0,0,0,.35)'; if(horizontal){ x.fillRect(pos,i*px,2,px); } pos+=len; }
    x.fillStyle='rgba(0,0,0,.3)'; if(horizontal) x.fillRect(0,i*px,512,1.5); else x.fillRect(i*px,0,1.5,512); }
}, 1, 1);
const concreteTex = (base) => canvasTex(256,256,(x,w,h)=>{ const r=rnd(7); x.fillStyle=base; x.fillRect(0,0,w,h); for(let i=0;i<4000;i++){ const v=r()<.5?0:255; x.fillStyle=`rgba(${v},${v},${v},${r()*0.06})`; x.fillRect(r()*w,r()*h,2+r()*3,2+r()*3);} }, 0.5, 0.5);
const TEX = {};
function floorMat(){ const f=S.floor; if(!TEX['f'+f]){
    if(f==='eiche') TEX['f'+f]=boardsTex('#c9a271',0.18*1,true,3);
    else if(f==='nussbaum') TEX['f'+f]=boardsTex('#6e4b33',0.18,true,5);
    else if(f==='vinyl') TEX['f'+f]=boardsTex('#a8a39b',0.22,true,9);
    else TEX['f'+f]=concreteTex('#9c9a95'); }
  return new THREE.MeshStandardMaterial({map:TEX['f'+f], roughness:f==='beton'?0.95:0.7}); }

const matCache = new Map();
function mat(color, o={}){ const k=color+JSON.stringify(o); if(!matCache.has(k)){
  matCache.set(k, new THREE.MeshStandardMaterial({color, roughness:o.r??0.75, metalness:o.m??0, transparent:o.op!=null, opacity:o.op??1,
    depthWrite:o.op==null, emissive:o.em||'#000000', emissiveIntensity:o.ei??0, side:o.op!=null?THREE.DoubleSide:THREE.FrontSide})); }
  return matCache.get(k); }
const GLASS = {op:0.22, r:0.05, m:0.2};
function B(g,w,h,d,c,x,y,z,o){ const m=new THREE.Mesh(new THREE.BoxGeometry(Math.max(w,0.001),Math.max(h,0.001),Math.max(d,0.001)), typeof c==='string'?mat(c,o):c); m.position.set(x,y,z); m.castShadow=!(o&&o.op!=null); m.receiveShadow=true; g.add(m); return m; }
function C(g,rt,rb,h,c,x,y,z,o,seg=20){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat(c,o)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; g.add(m); return m; }
function SPH(g,r,c,x,y,z){ const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1), mat(c,{r:0.9})); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; g.add(m); return m; }

/* ---------- Scan-Fotos ---------- */
const PHOTO = {};
async function loadPhotoTextures(texs){
  for(const k of Object.keys(PHOTO)){ PHOTO[k].dispose(); delete PHOTO[k]; }
  for(const [k,t] of Object.entries(texs||{})){ try{
    const img=new Image(); img.src=URL.createObjectURL(t.blob); await img.decode();
    const tx=new THREE.Texture(img); tx.colorSpace=THREE.SRGBColorSpace; tx.wrapS=tx.wrapT=THREE.ClampToEdgeWrapping; tx.anisotropy=8;
    tx.repeat.set(1/(t.u1-t.u0), 1/(t.v1-t.v0)); tx.offset.set(-t.u0*tx.repeat.x, -t.v0*tx.repeat.y); tx.needsUpdate=true; PHOTO[k]=tx;
  }catch(e){ console.warn('Foto',k,e); } }
}
const photoMat = (k) => new THREE.MeshStandardMaterial({map:PHOTO[k], roughness:0.7, metalness:0.05});
const hasPhotos = () => Object.keys(PHOTO).length>0;

/* ---------- Container bauen ---------- */
function panel(len, v0, v1, holes, depth, material){
  const s=new THREE.Shape(); s.moveTo(-len/2,v0); s.lineTo(len/2,v0); s.lineTo(len/2,v1); s.lineTo(-len/2,v1); s.closePath();
  for(const h of holes){ const a=Math.max(h.a,-len/2+0.02), b=Math.min(h.b,len/2-0.02), c=Math.max(h.c,v0+0.005), d=Math.min(h.d,v1-0.005);
    if(b-a<0.05||d-c<0.05) continue; const p=new THREE.Path(); p.moveTo(a,c); p.lineTo(a,d); p.lineTo(b,d); p.lineTo(b,c); p.closePath(); s.holes.push(p); }
  const g=new THREE.ExtrudeGeometry(s,{depth, bevelEnabled:false}); g.translate(0,0,-depth/2);
  const m=new THREE.Mesh(g,material); m.castShadow=m.receiveShadow=true; return m;
}
function wallDefs(){ const {L,W}=S; return [
  {key:'links',  len:L, pos:[0,0,-W/2], rotY:0, sign:1,  nrm:new THREE.Vector3(0,0,-1)},
  {key:'rechts', len:L, pos:[0,0, W/2], rotY:0, sign:-1, nrm:new THREE.Vector3(0,0,1)},
  {key:'hinten', len:W, pos:[-L/2,0,0], rotY:-Math.PI/2, sign:-1, nrm:new THREE.Vector3(-1,0,0)},
  {key:'vorne',  len:W, pos:[ L/2,0,0], rotY:-Math.PI/2, sign:1,  nrm:new THREE.Vector3(1,0,0)},
]; }
function wallLen(key){ return (key==='links'||key==='rechts')? S.L : S.W; }
function clampOpening(o){
  const len=wallLen(o.wall), maxHalf=len/2-0.2-S.ins, maxV=(S.H-0.17)-FLOOR_TOP;
  o.w=Math.min(Math.max(o.w,0.3), 2*maxHalf); o.u=Math.min(Math.max(o.u,-maxHalf+o.w/2), maxHalf-o.w/2);
  o.sill=Math.min(Math.max(o.sill,0), maxV-0.3); o.h=Math.min(Math.max(o.h,0.3), maxV-o.sill);
  for(const k of ['u','w','h','sill']) o[k]=Math.round(o[k]*100)/100;
}
function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); }); }

function buildContainer(){
  scene.remove(containerGroup); disposeTree(containerGroup);
  containerGroup = new THREE.Group(); scene.add(containerGroup); containerGroup.visible = !SC.hideContainer;
  wallGroups=[]; roofParts=[];
  const {L,W,H}=S, ins=S.ins, T=SKIN+ins+LINING, ceilY=H-0.06-ins;
  const tExt=corrugTex(); const extMat=new THREE.MeshStandardMaterial({color:S.ext, map:tExt, roughness:0.55, metalness:0.25});
  let intMat;
  if(S.intTex==='holz'){ TEX.wall=TEX.wall||boardsTex('#d8b98d',0.12,false,11); intMat=new THREE.MeshStandardMaterial({color:'#ffffff', map:TEX.wall, roughness:0.8}); }
  else if(S.intTex==='blech') intMat=new THREE.MeshStandardMaterial({color:S.int, map:corrugTex(), roughness:0.6, metalness:0.15});
  else intMat=new THREE.MeshStandardMaterial({color:S.int, roughness:0.9});
  const darker=lt(S.ext,-0.08);
  const frameM=mat(darker,{r:0.6,m:0.3});

  for(const wd of wallDefs()){
    const g=new THREE.Group(); g.position.set(...wd.pos); g.rotation.y=wd.rotY; g.userData.nrm=wd.nrm; g.userData.key=wd.key;
    const ops=S.openings.filter(o=>o.wall===wd.key);
    const holes=ops.map(o=>({a:o.u-o.w/2, b:o.u+o.w/2, c:FLOOR_TOP+o.sill, d:FLOOR_TOP+o.sill+o.h}));

  controls.update(); document.getElementById('hint').textContent=HINTS[m]; applyVisibility();
}
function applyVisibility(){ const showRoof=mode==='aussen'||mode==='ich'; roofParts.forEach(r=>r.visible=showRoof); if(mode!=='schnitt') wallGroups.forEach(w=>w.visible=true); }
const tmpV=new THREE.Vector3();
function cutaway(){ if(mode!=='schnitt') return; for(const w of wallGroups){ tmpV.copy(camera.position).sub(w.position); w.visible = tmpV.dot(w.userData.nrm) < 0.3; } }
function updateDims(){ const i=inner(); const p=PRESETS[S.preset]; document.getElementById('dims').textContent=`${p?p.name:'Eigene Maße'} · innen ${fmt(i.Li)} × ${fmt(i.Wi)} × ${fmt(i.Hi)} m · ${fmt(i.Li*i.Wi,1)} m²`; }

/* ---------- Interaktion ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function setRay(e){ const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); }
function itemFromObj(o){ while(o && o.parent!==itemsGroup) o=o.parent; return o; }
let drag=null, down=null, pointers=0;
viewport.addEventListener('pointerdown',e=>{
  pointers++; down={x:e.clientX,y:e.clientY,t:performance.now()};
  if(pointers>1 || mode==='ich') return;
  setRay(e); const hits=ray.intersectObjects(itemsGroup.children,true);
  if(hits.length){ const g=itemFromObj(hits[0].object); const it=S.items.find(i=>i.id===g.userData.id); if(!it) return;
    select(it.id); const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-g.position.y); const p=new THREE.Vector3();
    if(ray.ray.intersectPlane(plane,p)){ drag={it,g,plane,off:p.sub(g.position)}; controls.enabled=false; e.stopPropagation(); canvas.setPointerCapture?.(e.pointerId); }
  }
},{capture:true});
window.addEventListener('pointermove',e=>{ if(!drag) return; setRay(e); const p=new THREE.Vector3(); if(!ray.ray.intersectPlane(drag.plane,p)) return;
  p.sub(drag.off); drag.it.x=Math.round(p.x*20)/20; drag.it.z=Math.round(p.z*20)/20; placeItem(drag.g,drag.it); selHelper&&selHelper.update(); drag.moved=true; });
window.addEventListener('pointerup',e=>{ pointers=Math.max(0,pointers-1);
  if(drag){ controls.enabled=true; if(drag.moved){ save(); renderSel(); } drag=null; return; }
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), dt=performance.now()-down.t; down=null;
  if(moved>8||dt>500||e.target!==canvas) return;
  setRay(e);
  if(mode==='ich'){ const hits=ray.intersectObjects([containerGroup,ground,itemsGroup],true); const h=hits.find(h=>h.point.y<0.6 && h.face && h.face.normal.y>0.5) || hits.find(h=>h.object===ground);
    if(h){ const dir=new THREE.Vector3().subVectors(controls.target,camera.position); const y=(Math.abs(h.point.x)<S.L/2&&Math.abs(h.point.z)<S.W/2?FLOOR_TOP:0)+1.6;
      camera.position.set(h.point.x,y,h.point.z); controls.target.copy(camera.position).add(dir); controls.update(); } return; }
  if(!ray.intersectObjects(itemsGroup.children,true).length) select(null);
});
window.addEventListener('pointercancel',()=>{ pointers=0; if(drag){ controls.enabled=true; drag=null; } });

function select(id){ selId=id; refreshHelper(); renderSel(); }
const selEl=document.getElementById('sel');
function renderSel(){ const it=S.items.find(i=>i.id===selId); if(!it){ selEl.classList.remove('on'); selEl.innerHTML=''; return; }
  const c=catOf(it.k); selEl.classList.add('on');
  selEl.innerHTML=`<div class="selh"><b>${c?c.n:it.k}</b><span style="font-size:12px;color:#8a9aa8">x ${fmt(it.x)} · z ${fmt(it.z)} · ${Math.round(it.rot)}°</span><button data-sa="close">✕</button></div>
  <div class="acts"><button data-sa="r-15">↺ 15°</button><button data-sa="r90">↻ 90°</button><button data-sa="dup">Duplizieren</button><button data-sa="del" style="color:#ffb4b4">Löschen</button><input type="color" data-sc2="col" value="${it.col}"></div>
  <div class="row3"><div><label>Breite (m)</label><input type="number" step="0.05" inputmode="decimal" data-sf="w" value="${it.w}"></div><div><label>Tiefe (m)</label><input type="number" step="0.05" inputmode="decimal" data-sf="d" value="${it.d}"></div><div><label>Höhe (m)</label><input type="number" step="0.05" inputmode="decimal" data-sf="h" value="${it.h}"></div></div>`; }
selEl.addEventListener('click',e=>{ const a=e.target.dataset.sa; if(!a) return; const it=S.items.find(i=>i.id===selId); if(!it) return;
  if(a==='close') return select(null);
  if(a==='r-15'){ it.rot=(it.rot+345)%360; } if(a==='r90'){ it.rot=(it.rot+90)%360; }
  if(a==='del'){ S.items=S.items.filter(i=>i!==it); buildItems(); select(null); save(); renderTab(); return; }
  if(a==='dup'){ const n={...it,id:uid(),x:it.x+0.3,z:it.z+0.3}; S.items.push(n); itemsGroup.add(makeItem(n)); select(n.id); save(); return; }
  rebuildItem(it); renderSel(); save(); });
selEl.addEventListener('input',e=>{ const it=S.items.find(i=>i.id===selId); if(!it) return; if(e.target.dataset.sc2){ it.col=e.target.value; rebuildItem(it); save(); } });

/* ---------- Scan ---------- */
const SC={loaded:false,name:'',raw:null,scale:1,rot:0,x:0,y:0,z:0,op:1,vis:true,hideContainer:false,tilt:false,err:''};
function applyScan(){ scanRoot.position.set(SC.x,SC.y,SC.z); scanRoot.rotation.y=SC.rot*Math.PI/180; scanRoot.scale.setScalar(SC.scale); scanRoot.visible=SC.vis;
  scanTilt.rotation.x=SC.tilt?-Math.PI/2:0;
  scanTilt.traverse(n=>{ if(n.material){ (Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{ m.transparent=SC.op<1; m.opacity=SC.op; m.depthWrite=SC.op>=1; m.needsUpdate=true; }); } });
  containerGroup.visible=!SC.hideContainer; }
function recenterScan(){ const obj=scanTilt.children[0]; if(!obj) return;
  const sv={p:scanRoot.position.clone(),r:scanRoot.rotation.clone(),s:scanRoot.scale.clone()};
  scanRoot.position.set(0,0,0); scanRoot.rotation.set(0,0,0); scanRoot.scale.set(1,1,1); scanTilt.position.set(0,0,0); scanTilt.rotation.x=SC.tilt?-Math.PI/2:0;
  scanRoot.updateMatrixWorld(true); const b=new THREE.Box3().setFromObject(scanTilt); const c=b.getCenter(new THREE.Vector3());
  scanTilt.position.set(-c.x,-b.min.y,-c.z); SC.raw=b.getSize(new THREE.Vector3());
  scanRoot.position.copy(sv.p); scanRoot.rotation.copy(sv.r); scanRoot.scale.copy(sv.s); }
function setScanObject(obj,name){
  scanTilt.children.slice().forEach(ch=>{ scanTilt.remove(ch); disposeTree(ch); });
  obj.traverse(n=>{ if(n.isMesh){ n.castShadow=n.receiveShadow=true; n.material=Array.isArray(n.material)?n.material.map(m=>m.clone()):n.material.clone(); } else if(n.isPoints){ n.material=n.material.clone(); } });
  scanTilt.add(obj); SC.loaded=true; SC.name=name; SC.err=''; SC.scale=1; SC.rot=0; SC.x=0; SC.y=0; SC.z=0; SC.tilt=false;
  recenterScan();
  // offensichtliche Einheitenfehler (cm/mm) automatisch korrigieren
  const m=Math.max(SC.raw.x,SC.raw.y,SC.raw.z); if(m>200) SC.scale=0.001; else if(m>40) SC.scale=0.01;
  applyScan(); renderTab(); if(mode==='ich') setView('aussen'); }
function geomToObj(geo){ const hasCol=!!geo.attributes.color;
  if(geo.index || geo.attributes.normal){ if(!geo.attributes.normal) geo.computeVertexNormals(); return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:hasCol?'#ffffff':'#b8b8b8',vertexColors:hasCol,roughness:0.85,side:THREE.DoubleSide})); }
  return new THREE.Points(geo,new THREE.PointsMaterial({size:0.012,vertexColors:hasCol,color:hasCol?'#ffffff':'#cccccc'})); }
function loadScanFile(file){
  const ext=file.name.split('.').pop().toLowerCase(); const rd=new FileReader(); SC.err=''; renderTab();
  const fail=(msg)=>{ SC.err=msg; renderTab(); };
  rd.onerror=()=>fail('Datei konnte nicht gelesen werden.');
  rd.onload=()=>{ try{
    if(ext==='glb'||ext==='gltf'){ const l=new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
      l.parse(rd.result,'',g=>setScanObject(g.scene,file.name),err=>fail('GLB konnte nicht geladen werden ('+(err&&err.message||'unbekannt')+'). Tipp: ohne Draco-Komprimierung exportieren.')); }
    else if(ext==='obj'){ setScanObject(new OBJLoader().parse(rd.result),file.name); }
    else if(ext==='ply'){ const geo=new PLYLoader().parse(rd.result); setScanObject(geomToObj(geo),file.name); }
    else if(ext==='stl'){ const geo=new STLLoader().parse(rd.result); geo.computeVertexNormals(); setScanObject(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:'#b8b8b8',roughness:0.8})),file.name); }
    else fail('Format nicht unterstützt. Bitte GLB, OBJ, PLY oder STL.');
  }catch(err){ fail('Fehler beim Laden: '+err.message); } };
  if(ext==='obj') rd.readAsText(file); else rd.readAsArrayBuffer(file);
}

let newArmed=false;
content.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.sw){ S.ext=d.sw; buildContainer(); renderTab(); save(); }
  if(d.delphoto){ if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Wirklich löschen?'; return; } idbDel('textures').catch(()=>{}); loadPhotoTextures({}).then(()=>{ buildContainer(); renderTab(); }); }
  if(d.addop){ const t=OPTYPES[d.addop]; const o={id:uid(),wall:d.addop==='fenster'?'links':'rechts',type:d.addop,u:0,w:t.w,h:t.h,sill:t.sill}; clampOpening(o); S.openings.push(o); buildContainer(); renderTab(); save();
    if(mode==='oben') setView('aussen'); }
  if(d.delop){ S.openings=S.openings.filter(o=>o.id!==d.delop); buildContainer(); renderTab(); save(); }
  if(d.additem){ const c=catOf(d.additem); const out=c.c==='Außen'&&c.k!=='solar'; const it={id:uid(),k:c.k,x:out?0:Math.round((Math.random()-0.5)*Math.max(0.2,inner().Li-2)*20)/20,z:out?Math.round((S.W/2+c.d/2+0.4)*20)/20:0,rot:0,w:c.w,d:c.d,h:c.h,col:c.col};
    S.items.push(it); itemsGroup.add(makeItem(it)); select(it.id); save(); if(!out && c.k!=='solar' && (mode==='aussen'||mode==='ich')) setView('schnitt'); if(c.k==='solar'&&mode!=='aussen') setView('aussen'); }
  if(d.sb){ const a=d.sb;
    if(a==='x10') SC.scale=+(SC.scale*10).toPrecision(4); if(a==='x01') SC.scale=+(SC.scale/10).toPrecision(4);
    if(a==='center'){ SC.x=0; SC.y=0; SC.z=0; }
    if(a==='r90') SC.rot=(SC.rot+90)%360;
    if(a==='tilt'){ SC.tilt=!SC.tilt; recenterScan(); }
    if(a==='remove'){ scanTilt.children.slice().forEach(ch=>{ scanTilt.remove(ch); disposeTree(ch); }); SC.loaded=false; SC.hideContainer=false; }
    if(a==='dims'){ scanRoot.updateMatrixWorld(true); const s=new THREE.Box3().setFromObject(scanTilt).getSize(new THREE.Vector3());
      S.L=+Math.max(s.x,s.z).toFixed(3); S.W=+Math.min(s.x,s.z).toFixed(3); S.H=+s.y.toFixed(3); S.preset='custom'; if(s.z>s.x) SC.rot=(SC.rot+90)%360;
      S.openings.forEach(clampOpening); buildContainer(); buildItems(); save(); }
    applyScan(); renderTab(); }
  if(d.pa){ const a=d.pa;
    if(a==='shot'){ renderer.render(scene,camera); const url=canvas.toDataURL('image/png'); openModal(`<img src="${url}" alt="Container-Ansicht"><a class="btn pri" style="display:inline-block;text-decoration:none;margin-bottom:8px" href="${url}" download="container.png">Bild herunterladen</a><p class="info">Oder Bild lange drücken → speichern.</p><button class="btn" data-close>Schließen</button>`); }
    if(a==='copy'){ const txt=JSON.stringify(S); const m=document.getElementById('projmsg'); const ta=document.getElementById('projtxt');
      navigator.clipboard?.writeText(txt).then(()=>m.textContent='In die Zwischenablage kopiert.').catch(()=>{ ta.value=txt; ta.select(); m.textContent='Text unten markiert – bitte manuell kopieren.'; }) ?? (ta.value=txt, ta.select(), m.textContent='Text unten markiert – bitte manuell kopieren.'); }
    if(a==='load'){ const m=document.getElementById('projmsg'); try{ const o=JSON.parse(document.getElementById('projtxt').value); if(!o||!Array.isArray(o.items)) throw 0; S={...defaultState(),...o}; selId=null; renderSel(); buildContainer(); buildItems(); save(); renderTab(); }catch(err){ m.textContent='Text ist kein gültiges Projekt.'; } }
    if(a==='new'){ if(!newArmed){ newArmed=true; b.textContent='Wirklich alles löschen?'; setTimeout(()=>{ newArmed=false; const nb=document.getElementById('newbtn'); if(nb) nb.textContent='Neues Projekt'; },3000); return; }
      newArmed=false; S=defaultState(); S.openings=[]; S.items=[]; selId=null; renderSel(); buildContainer(); buildItems(); save(); renderTab(); setView('aussen'); }
  }
});
const modal=document.getElementById('modal');
function openModal(html){ document.getElementById('modalbox').innerHTML=html; modal.hidden=false; }
modal.addEventListener('click',async e=>{
  const imp=e.target.dataset.imp;
  if(imp){ const sc=pendingScan; pendingScan=null; modal.hidden=true;
    if(imp==='yes' && sc){ Object.assign(S,{L:sc.L,W:sc.W,H:sc.H,preset:PRESETS[sc.preset]?sc.preset:'custom',openings:sc.openings||[],photoOut:true,photoIn:true});
      S.openings.forEach(clampOpening);
      try{ await idbSet('textures', sc.textures||{}); }catch(err){}
      await loadPhotoTextures(sc.textures||{}); buildContainer(); buildItems(); save(); tab='container';
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='container')); renderTab(); setView('aussen'); }
    idbDel('pending-scan').catch(()=>{}); history.replaceState(null,'',location.pathname); return; }
  if(e.target===modal||e.target.dataset.close!==undefined) modal.hidden=true; });
let pendingScan=null;
async function checkPendingScan(){ let sc=null; try{ sc=await idbGet('pending-scan'); }catch(e){ return; } if(!sc) return; pendingScan=sc;
  const n=Object.keys(sc.textures||{}).length;
  openModal(`<h3 style="margin:2px 0 8px">Neuer Scan gefunden</h3><p class="info">Container <b>${fmt(sc.L)} × ${fmt(sc.W)} × ${fmt(sc.H)} m</b>${PRESETS[sc.preset]?' ('+PRESETS[sc.preset].name+')':''}<br>${(sc.openings||[]).length} Fenster/Türen · ${n} Wandfläche(n) mit Foto</p>
  <p class="info">„Übernehmen“ ersetzt Maße, Fenster und Türen. Deine Möbel bleiben.</p>
  <div class="btnrow" style="justify-content:center"><button class="btn pri" data-imp="yes">Übernehmen</button><button class="btn" data-imp="no">Verwerfen</button></div>`); }
document.querySelector('.views').addEventListener('click',e=>{ const v=e.target.dataset.view; if(v) setView(v); });

/* ---------- Start ---------- */
function onResize(){ const r=viewport.getBoundingClientRect(); if(r.width<2||r.height<2) return; renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(onResize).observe(viewport); window.addEventListener('resize',onResize);
S.openings.forEach(clampOpening);
buildContainer(); buildItems(); renderTab(); setView('aussen'); onResize();
idbGet('textures').then(async t=>{ if(t&&Object.keys(t).length){ await loadPhotoTextures(t); buildContainer(); renderTab(); } }).catch(()=>{}).finally(checkPendingScan);
renderer.setAnimationLoop(()=>{ controls.update(); cutaway();
  const roofOn=mode==='aussen'||mode==='ich'; for(const g of itemsGroup.children){ if(g.position.y>1) g.visible=roofOn; } renderer.render(scene,camera); });
</script>
</body>
</html>
